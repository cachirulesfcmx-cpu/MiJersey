events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/json application/javascript text/xml application/xml;

  # No anunciar la versión de Nginx en headers de error/respuesta (035 §3).
  server_tokens off;

  # Límite de tamaño de body a nivel de borde — antes de que llegue a Node/Nest.
  client_max_body_size 10m;

  # Rate limiting a nivel de borde (035 §3), independiente y adicional al de
  # @nestjs/throttler dentro de la API: esto absorbe tráfico abusivo antes de
  # que abra siquiera una conexión hacia el proceso Node. `burst` permite
  # ráfagas cortas legítimas (carga de una página con varios assets) sin
  # rechazarlas de inmediato.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  upstream web_upstream {
    server web:3000;
  }

  upstream api_upstream {
    server api:4000;
  }

  # apps/admin no se enruta por prefijo de ruta: Next.js requiere basePath
  # coincidente para todos sus assets, lo cual complica innecesariamente el
  # entorno de desarrollo local. Aquí se expone directamente en su propio
  # puerto (admin:3001); la topología de producción (subdominios, etc.) se
  # define en el despliegue real (Vercel/Railway), no en este nginx local.

  server {
    listen 80;

    limit_req zone=general burst=40 nodelay;

    # Prometheus/metrics nunca debe quedar expuesto a Internet (035 §3/§4):
    # solo redes privadas típicas de scraping interno (loopback, RFC1918).
    # MetricsController documenta esta expectativa del lado de la API.
    location /api/metrics {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;

      proxy_pass http://api_upstream/metrics;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
