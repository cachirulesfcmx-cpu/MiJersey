name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@9.15.0 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 035-Production-Hardening: reporta vulnerabilidades conocidas en dependencias
      # (npm advisory database) sin bloquear el pipeline — al momento de agregar este
      # paso el proyecto ya arrastra CVEs altas/críticas heredadas de Next.js 14 y del
      # toolchain de ESLint (ver docs/production-hardening.md, sección de deuda de
      # seguridad conocida). Bloquear el build hoy dejaría el CI permanentemente en
      # rojo sin una campaña de actualización de dependencias fuera del alcance de
      # este cambio; este paso existe para que las vulnerabilidades sean visibles en
      # cada corrida en lugar de invisibles.
      - name: Dependency audit (no bloqueante)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Generate Prisma Client
        run: pnpm --filter @mijersey/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify build artifacts
        run: |
          test -f apps/api/dist/main.js
          test -d apps/web/.next/standalone
          test -d apps/admin/.next/standalone
